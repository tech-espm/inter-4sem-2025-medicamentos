<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    
    <title>Login • SintoMed</title>

    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <style>
        :root {
            --cor-1: #b40a10;
            --cor-2: #ed1d24;
            --cor-3: #51ace4;
            --cor-4: #3477a6;
            --cor-5: #215274;
            --cor-6: #0097a7;
            --cor-7: #00838f;
            --cor-8: #006064;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: url(/static/img/background.jpg);
            background-size: cover;
            font-family: 'Ubuntu', sans-serif;
        }

        .login-card {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 0 15px 60px rgba(0,0,0,0.15);
        }

        .title {
            font-family: Ubuntu;
            text-align: center;
            font-size: 2rem;
            color: var(--cor-5);
            margin-bottom: 1.5rem;
        }

        .btn-login {
            width: 100%;
            padding: .8rem;
            border-radius: 50px;
            background: linear-gradient(135deg, var(--cor-2), var(--cor-1));
            color: #fff;
            border: none;
            font-weight: bold;
            font-size: 1rem;
            transition: .2s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, var(--cor-1), var(--cor-2));
            box-shadow: 0 6px 18px rgba(180,10,16,0.28);

        }

        .input-label {
            font-weight: 600;
            color: var(--cor-5);
        }

        a.voltar {
            display: block;
            text-align: center;
            margin-top: 1rem;
            color: white;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="row" style="justify-content: center;">
            <div class="col-md-3">
                <img src="/static/img/logo.png" alt="Logo da SintoMed" style="max-width: 50px;">
            </div>
            <div class="col-md-6">
                <h2 class="title" style="font-weight: bold; text-align: center;">SintoMed</h2>
            </div>
            <div class="col-md-1">
                <a href="/" style="text-decoration: none;">
                    <i class="fa-regular fa-circle-xmark" style="color: #215274; cursor: pointer; font-size: 1.4rem;"></i>
                </a>
            </div>
        </div>

        <form method="POST" action="/cadastro">
            <div class="row" style="justify-content: center;">
                <div class="col-md-6">
                    <div class="form-group mb-3">
                        <label class="input-label" for="name">Nome Completo</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group mb-3">
                        <label class="input-label" for="age">Data de Nascimento</label>
                        <input type="date" class="form-control" id="age" name="age" required>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="form-group mb-3">
                        <label class="input-label" for="doc">CPF</label>
                        <input type="number" class="form-control" id="doc" name="doc" placeholder="000.000.000-00" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group mb-3">
                        <label class="input-label" for="age">Data de Nascimento</label>
                        <input type="date" class="form-control" id="age" name="age" required>
                    </div>
                </div>
            </div>

            <div class="form-group mb-3">
                <label class="input-label" for="username">Email</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="sintomed@email.com" required>
            </div>

            <div class="form-group mb-4">
                <label class="input-label" for="password">Senha</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>

            <button class="btn-login" type="submit">Entrar</button>
        </form>
    </div>

</body>
</html>
